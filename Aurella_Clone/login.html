<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Aurella</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="logo">
        <a href="index.html">
          <img src="./aurella_logo_custom.svg" alt="Aurella Luxury Logo" />
        </a>
      </div>
      <nav>
        <a href="index.html">Home</a>
      </nav>
    </header>
    <section class="user">

      <form>
        <input type="email" placeholder="Email" required />

        <p>
          New to Aurella?
          <a href="signup.html">Create account</a>
        </p>
      </form>
    </section>
  </body>
</html>
